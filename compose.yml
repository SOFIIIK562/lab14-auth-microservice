services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab14
      POSTGRES_USER: lab14
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab14 -d lab14"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8014:8000"
    environment:
      DATABASE_URL: postgresql://lab14:${POSTGRES_PASSWORD}@db:5432/lab14
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
